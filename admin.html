<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2G Entertainment - Admin Upload Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .admin-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h2 { color: #ff8c00; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #e07b00; }
        #status-msg { text-align: center; margin-top: 15px; font-size: 14px; color: #ff8c00; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>2G Admin Portal</h2>
        
        <div class="form-group">
            <label>Track Title</label>
            <input type="text" id="track-title" placeholder="e.g., Summer Anthem">
        </div>

        <div class="form-group">
            <label>Select Artist</label>
            <select id="artist-select">
                <option value="">Loading artists...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Audio File (.mp3)</label>
            <input type="file" id="audio-file" accept="audio/*">
        </div>

        <div class="form-group">
            <label>Artwork Image (.jpg / .png)</label>
            <input type="file" id="artwork-file" accept="image/*">
        </div>

        <button onclick="uploadTrack()">Upload to Supabase</button>
        <p id="status-msg"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Load artists into dropdown on page load
        async function loadArtists() {
            const { data, error } = await _supabase.from('artists').select('id, name');
            const select = document.getElementById('artist-select');
            
            if (error) {
                console.error('Error loading artists:', error);
                select.innerHTML = '<option value="">Error loading artists</option>';
                return;
            }

            select.innerHTML = '<option value="">-- Choose Artist --</option>';
            data.forEach(artist => {
                select.innerHTML += `<option value="${artist.id}">${artist.name}</option>`;
            });
        }

        async function uploadTrack() {
            const title = document.getElementById('track-title').value;
            const artistId = document.getElementById('artist-select').value;
            const audioFile = document.getElementById('audio-file').files[0];
            const artworkFile = document.getElementById('artwork-file').files[0];
            const statusMsg = document.getElementById('status-msg');

            if (!title || !artistId || !audioFile) {
                alert('Please fill out the title, artist, and select an audio file.');
                return;
            }

            statusMsg.innerText = 'Uploading files to storage...';

            try {
                // 1. Upload Audio File to Supabase Storage Bucket ('audio-tracks')
                const audioFileName = `${Date.now()}_${audioFile.name}`;
                const { data: audioData, error: audioError } = await _supabase.storage
                    .from('audio-tracks')
                    .upload(audioFileName, audioFile);

                if (audioError) throw audioError;

                // Get Public URL for Audio
                const { data: audioPublicUrl } = _supabase.storage
                    .from('audio-tracks')
                    .getPublicUrl(audioFileName);

                // 2. Upload Artwork (if provided) to 'artwork' bucket
                let artworkPublicUrl = '';
                if (artworkFile) {
                    const artFileName = `${Date.now()}_${artworkFile.name}`;
                    const { data: artData, error: artError } = await _supabase.storage
                        .from('artwork')
                        .upload(artFileName, artworkFile);

                    if (artError) throw artError;

                    const { data: artPublicUrl } = _supabase.storage
                        .from('artwork')
                        .getPublicUrl(artFileName);
                    
                    artworkPublicUrl = artPublicUrl.publicUrl;
                }

                statusMsg.innerText = 'Saving track to database...';

                // 3. Insert record into 'tracks' table
                const { error: dbError } = await _supabase
                    .from('tracks')
                    .insert([{
                        title: title,
                        artist_id: artistId,
                        audio_file_path: audioPublicUrl.publicUrl,
                        artwork_url: artworkPublicUrl
                    }]);

                if (dbError) throw dbError;

                statusMsg.innerText = 'Upload successful! Track is live.';
                setTimeout(() => {
                    document.getElementById('track-title').value = '';
                    document.getElementById('audio-file').value = '';
                    document.getElementById('artwork-file').value = '';
                    statusMsg.innerText = '';
                }, 3000);

            } catch (err) {
                console.error(err);
                statusMsg.innerText = 'Error: ' + err.message;
            }
        }

        loadArtists();
    </script>
</body>
</html>
