<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2G Entertainment - Admin Upload Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .admin-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
            max-height: 90vh;
            overflow-y: auto;
        }
        h2 { color: #ff8c00; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #e07b00; }
        .secondary-btn {
            background-color: #333;
            color: #ff8c00;
            border: 1px solid #ff8c00;
            margin-top: 5px;
            padding: 8px;
            font-size: 12px;
        }
        .secondary-btn:hover { background-color: #444; }
        #status-msg { text-align: center; margin-top: 15px; font-size: 14px; color: #ff8c00; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>2G Admin Portal</h2>
        
        <div class="form-group">
            <label>Track Title</label>
            <input type="text" id="track-title" placeholder="e.g., Summer Anthem">
        </div>

        <!-- Artist Section -->
        <div class="form-group" id="select-artist-section">
            <label>Select Artist</label>
            <select id="artist-select">
                <option value="">Loading artists...</option>
            </select>
            <button type="button" class="secondary-btn" onclick="toggleNewArtistForm()">+ Add New Artist</button>
        </div>

        <!-- New Artist Form (Hidden by default) -->
        <div class="form-group hidden" id="new-artist-section">
            <label>New Artist Name</label>
            <input type="text" id="new-artist-name" placeholder="e.g., Lou Kain">
            
            <label style="margin-top: 10px;">AWeber Tag</label>
            <input type="text" id="new-artist-tag" placeholder="e.g., lou-kain-fan">
            
            <button type="button" class="secondary-btn" style="background:#222; color:#fff; border-color:#555;" onclick="createNewArtist()">Save New Artist</button>
            <button type="button" class="secondary-btn" onclick="toggleNewArtistForm()">Cancel</button>
        </div>

        <div class="form-group">
            <label>Audio File (.mp3)</label>
            <input type="file" id="audio-file" accept="audio/*">
        </div>

        <div class="form-group">
            <label>Artwork Image (.jpg / .png)</label>
            <input type="file" id="artwork-file" accept="image/*">
        </div>

        <!-- Streaming Link Inputs -->
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <p style="font-size: 13px; color: #ff8c00; margin-bottom: 15px; font-weight: bold; text-align: center;">Streaming Platform Links (Optional)</p>

        <div class="form-group">
            <label>Spotify URL</label>
            <input type="url" id="admin-spotify" placeholder="https://spotify.com/track/...">
        </div>
        <div class="form-group">
            <label>Apple Music URL</label>
            <input type="url" id="admin-apple" placeholder="https://music.apple.com/...">
        </div>
        <div class="form-group">
            <label>Tidal URL</label>
            <input type="url" id="admin-tidal" placeholder="https://tidal.com/track/...">
        </div>
        <div class="form-group">
            <label>YouTube URL</label>
            <input type="url" id="admin-youtube" placeholder="https://youtube.com/watch?v=...">
        </div>
        <div class="form-group">
            <label>Pandora URL</label>
            <input type="url" id="admin-pandora" placeholder="https://pandora.com/...">
        </div>

        <!-- Store Link Inputs -->
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <p style="font-size: 13px; color: #ff8c00; margin-bottom: 15px; font-weight: bold; text-align: center;">Direct Store Links (Optional)</p>

        <div class="form-group">
            <label>Store - Single Purchase URL</label>
            <input type="url" id="admin-store-single" placeholder="https://yourstore.com/product/single...">
        </div>
        <div class="form-group">
            <label>Store - Album Purchase URL</label>
            <input type="url" id="admin-store-album" placeholder="https://yourstore.com/product/album...">
        </div>

        <button onclick="uploadTrack()">Upload to Supabase</button>
        <p id="status-msg"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Load artists into dropdown on page load
        async function loadArtists() {
            const { data, error } = await _supabase.from('artists').select('id, name').order('name');
            const select = document.getElementById('artist-select');
            
            if (error) {
                console.error('Error loading artists:', error);
                select.innerHTML = '<option value="">Error loading artists</option>';
                return;
            }

            select.innerHTML = '<option value="">-- Choose Artist --</option>';
            data.forEach(artist => {
                select.innerHTML += `<option value="${artist.id}">${artist.name}</option>`;
            });
        }

        // Toggle between dropdown and new artist form
        function toggleNewArtistForm() {
            const selectSection = document.getElementById('select-artist-section');
            const newSection = document.getElementById('new-artist-section');
            
            selectSection.classList.toggle('hidden');
            newSection.classList.toggle('hidden');
        }

        // Create a new artist on the fly
        async function createNewArtist() {
            const name = document.getElementById('new-artist-name').value.trim();
            const tag = document.getElementById('new-artist-tag').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!name || !tag) {
                alert('Please enter both an artist name and an AWeber tag.');
                return;
            }

            statusMsg.innerText = 'Creating new artist...';

            const { data, error } = await _supabase
                .from('artists')
                .insert([{ name: name, aweber_tag: tag }])
                .select();

            if (error) {
                console.error('Error creating artist:', error);
                statusMsg.innerText = 'Error: ' + error.message;
                return;
            }

            statusMsg.innerText = 'Artist created successfully!';
            
            await loadArtists();
            if (data && data.length > 0) {
                document.getElementById('artist-select').value = data[0].id;
            }

            document.getElementById('new-artist-name').value = '';
            document.getElementById('new-artist-tag').value = '';
            toggleNewArtistForm();
            setTimeout(() => { statusMsg.innerText = ''; }, 3000);
        }

        async function uploadTrack() {
            const title = document.getElementById('track-title').value;
            const artistId = document.getElementById('artist-select').value;
            const audioFile = document.getElementById('audio-file').files[0];
            const artworkFile = document.getElementById('artwork-file').files[0];
            
            // Get streaming and store links from form inputs
            const spotifyUrl = document.getElementById('admin-spotify').value.trim();
            const appleUrl = document.getElementById('admin-apple').value.trim();
            const tidalUrl = document.getElementById('admin-tidal').value.trim();
            const youtubeUrl = document.getElementById('admin-youtube').value.trim();
            const pandoraUrl = document.getElementById('admin-pandora').value.trim();
            const storeSingleUrl = document.getElementById('admin-store-single').value.trim();
            const storeAlbumUrl = document.getElementById('admin-store-album').value.trim();

            const statusMsg = document.getElementById('status-msg');

            if (!title || !artistId || !audioFile) {
                alert('Please fill out the title, select an artist, and pick an audio file.');
                return;
            }

            statusMsg.innerText = 'Uploading files to storage...';

            try {
                // 1. Upload Audio File to Supabase Storage Bucket ('audio-tracks')
                const audioFileName = `${Date.now()}_${audioFile.name}`;
                const { data: audioData, error: audioError } = await _supabase.storage
                    .from('audio-tracks')
                    .upload(audioFileName, audioFile);

                if (audioError) throw audioError;

                const { data: audioPublicUrl } = _supabase.storage
                    .from('audio-tracks')
                    .getPublicUrl(audioFileName);

                // 2. Upload Artwork (if provided) to 'artwork' bucket
                let artworkPublicUrl = '';
                if (artworkFile) {
                    const artFileName = `${Date.now()}_${artworkFile.name}`;
                    const { data: artData, error: artError } = await _supabase.storage
                        .from('artwork')
                        .upload(artFileName, artworkFile);

                    if (artError) throw artError;

                    const { data: artPublicUrl } = _supabase.storage
                        .from('artwork')
                        .getPublicUrl(artFileName);
                    
                    artworkPublicUrl = artPublicUrl.publicUrl;
                }

                statusMsg.innerText = 'Saving track to database...';

                // 3. Insert record into 'tracks' table including streaming & store URLs
                const { error: dbError } = await _supabase
                    .from('tracks')
                    .insert([{
                        title: title,
                        artist_id: artistId,
                        audio_file_path: audioPublicUrl.publicUrl,
                        artwork_url: artworkPublicUrl,
                        spotify_url: spotifyUrl || null,
                        apple_music_url: appleUrl || null,
                        tidal_url: tidalUrl || null,
                        youtube_url: youtubeUrl || null,
                        pandora_url: pandoraUrl || null,
                        store_single_url: storeSingleUrl || null,
                        store_album_url: storeAlbumUrl || null
                    }]);

                if (dbError) throw dbError;

                statusMsg.innerText = 'Upload successful! Track is live.';
                setTimeout(() => {
                    document.getElementById('track-title').value = '';
                    document.getElementById('audio-file').value = '';
                    document.getElementById('artwork-file').value = '';
                    document.getElementById('admin-spotify').value = '';
                    document.getElementById('admin-apple').value = '';
                    document.getElementById('admin-tidal').value = '';
                    document.getElementById('admin-youtube').value = '';
                    document.getElementById('admin-pandora').value = '';
                    document.getElementById('admin-store-single').value = '';
                    document.getElementById('admin-store-album').value = '';
                    statusMsg.innerText = '';
                }, 3000);

            } catch (err) {
                console.error(err);
                statusMsg.innerText = 'Error: ' + err.message;
            }
        }

        loadArtists();
    </script>
</body>
</html>
