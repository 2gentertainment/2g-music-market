<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2G Entertainment - Manage Playlists & Albums</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .admin-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 460px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
            max-height: 90vh;
            overflow-y: auto;
        }
        h2 { color: #ff8c00; text-align: center; margin-top: 0; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus { border-color: #ff8c00; outline: none; }
        button {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            margin-top: 5px;
        }
        button:hover { background-color: #e07b00; }
        #status-msg { text-align: center; margin-top: 12px; font-size: 13px; color: #ff8c00; }
        
        .collections-list { margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .collection-item {
            background: #161616;
            border: 1px solid #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .col-info h4 { margin: 0 0 4px 0; font-size: 14px; color: #fff; }
        .col-info span { font-size: 11px; color: #ff8c00; text-transform: uppercase; letter-spacing: 0.5px; }
        .col-actions { display: flex; gap: 6px; }
        .col-actions button { padding: 6px 10px; font-size: 11px; width: auto; margin-top: 0; }
        .btn-songs { background: #333; color: #fff; border: 1px solid #555; }
        .btn-songs:hover { background: #444; border-color: #ff8c00; }
        .btn-visible { background: #1a2e1a; color: #4cd137; border: 1px solid #2e522e; }
        .btn-hidden { background: #2e1a1a; color: #e84118; border: 1px solid #522e2e; }
        .btn-delete { background: #3a1515; color: #ff5252; border: 1px solid #552222; }
        .btn-delete:hover { background: #521a1a; }

        /* Modal Overlay for Track Reordering */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            width: 440px;
            max-height: 85vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .modal-header h3 { margin: 0; font-size: 16px; color: #ff8c00; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
        .modal-instructions { font-size: 12px; color: #888; margin-bottom: 12px; text-align: center; }

        .track-list-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 50vh;
            padding-right: 4px;
            margin-bottom: 15px;
        }
        .track-drag-card {
            background: #252525;
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #333;
            cursor: grab;
            transition: background 0.2s, border-color 0.2s;
        }
        .track-drag-card:active { cursor: grabbing; }
        .track-drag-card.dragging { opacity: 0.4; border-color: #ff8c00; }
        .track-drag-card.drag-over { border-color: #ff8c00; background: #2f2316; }
        .track-drag-card img { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; }
        .track-drag-info { flex: 1; overflow: hidden; }
        .track-drag-title { font-size: 12px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .drag-handle { color: #555; font-size: 14px; cursor: grab; }

        .link-back { display: block; text-align: center; margin-top: 15px; font-size: 12px; color: #888; text-decoration: none; }
        .link-back:hover { color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Manage Playlists & Albums</h2>

        <div class="form-group">
            <label>Collection Title</label>
            <input type="text" id="col-title" placeholder="e.g., Summer Mixtape or Album Name">
        </div>

        <div class="form-group">
            <label>Type</label>
            <select id="col-type">
                <option value="album">Album (Artist Project)</option>
                <option value="playlist">Curated General Playlist</option>
            </select>
        </div>

        <div class="form-group">
            <label>Associated Artist (Optional for Albums)</label>
            <select id="artist-select">
                <option value="">-- None (General Playlist) --</option>
            </select>
        </div>

        <button onclick="createCollection()">Create Collection</button>
        <p id="status-msg"></p>

        <div class="collections-list">
            <h3 style="font-size: 15px; color: #fff; margin-top: 0;">Existing Collections</h3>
            <div id="collections-container">
                <p style="text-align: center; color: #777; font-size: 12px;">Loading collections...</p>
            </div>
        </div>

        <a href="adminhub.html" class="link-back">← Back to Master Admin Hub</a>
    </div>

    <!-- Reorder Modal Popup (Hidden by default now) -->
    <div id="reorder-modal" class="modal-overlay hidden" onclick="closeReorderModalOnOutside(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-album-title">Manage Tracks</h3>
                <button class="close-btn" onclick="closeReorderModal()">&times;</button>
            </div>
            <p class="modal-instructions">Drag and drop tracks to reorder them within this collection. Changes save automatically.</p>
            
            <div id="modal-track-list" class="track-list-box"></div>
            
            <button onclick="saveCollectionOrder()">💾 Save New Order</button>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('2g_admin_auth') !== 'true') {
            window.location.href = 'adminhub.html';
        }

        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let collectionsList = [];
        let activeCollectionId = null;
        let activeCollectionTracks = [];
        let draggedIndex = null;

        async function init() {
            await loadArtists();
            await loadCollections();
        }

        async function loadArtists() {
            const { data, error } = await _supabase.from('artists').select('id, name').order('name');
            if (!error && data) {
                const select = document.getElementById('artist-select');
                data.forEach(artist => {
                    select.innerHTML += `<option value="${artist.id}">${artist.name}</option>`;
                });
            }
        }

        async function loadCollections() {
            const { data, error } = await _supabase
                .from('collections')
                .select('id, title, type, is_visible, artist_id, artists(name)')
                .order('sort_order', { ascending: true, nullsFirst: true });

            if (!error && data) {
                collectionsList = data;
                renderCollections();
            }
        }

        function renderCollections() {
            const container = document.getElementById('collections-container');
            container.innerHTML = '';

            if (collectionsList.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #777; font-size: 12px;">No collections created yet.</p>';
                return;
            }

            collectionsList.forEach(col => {
                const item = document.createElement('div');
                item.className = 'collection-item';
                
                const artistLabel = col.artists ? ` • ${col.artists.name}` : '';

                item.innerHTML = `
                    <div class="col-info">
                        <h4>${col.title}</h4>
                        <span>${col.type}${artistLabel}</span>
                    </div>
                    <div class="col-actions">
                        <button class="btn-songs" onclick="openReorderModal('${col.id}', '${col.title}')">Songs</button>
                        <button class="${col.is_visible ? 'btn-visible' : 'btn-hidden'}" onclick="toggleVisibility('${col.id}', ${col.is_visible})">
                            ${col.is_visible ? 'Visible' : 'Hidden'}
                        </button>
                        <button class="btn-delete" onclick="deleteCollection('${col.id}')">Delete</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function createCollection() {
            const title = document.getElementById('col-title').value.trim();
            const type = document.getElementById('col-type').value;
            const artistId = document.getElementById('artist-select').value;
            const statusMsg = document.getElementById('status-msg');

            if (!title) {
                alert('Please enter a collection title.');
                return;
            }

            statusMsg.innerText = 'Creating collection...';

            const { error } = await _supabase.from('collections').insert([{
                title: title,
                type: type,
                artist_id: artistId ? artistId : null,
                is_visible: true,
                sort_order: 99
            }]);

            if (error) {
                statusMsg.innerText = 'Error: ' + error.message;
                return;
            }

            statusMsg.innerText = 'Collection created successfully!';
            document.getElementById('col-title').value = '';
            setTimeout(() => { statusMsg.innerText = ''; }, 2000);
            loadCollections();
        }

        async function toggleVisibility(id, currentStatus) {
            const { error } = await _supabase
                .from('collections')
                .update({ is_visible: !currentStatus })
                .eq('id', id);

            if (!error) loadCollections();
        }

        async function deleteCollection(id) {
            if (!confirm('Are you sure you want to delete this collection? Associated tracks will become standalone singles.')) return;

            // Unlink tracks first
            await _supabase.from('tracks').update({ collection_id: null }).eq('collection_id', id);
            const { error } = await _supabase.from('collections').delete().eq('id', id);

            if (!error) loadCollections();
        }

        /* --- Reorder Modal & Drag-and-Drop Functions --- */
        async function openReorderModal(collectionId, collectionTitle) {
            activeCollectionId = collectionId;
            document.getElementById('modal-album-title').innerText = `Manage: ${collectionTitle}`;
            
            // Fetch tracks belonging to this collection ordered by collection_sort_order
            const { data, error } = await _supabase
                .from('tracks')
                .select('id, title, artwork_url, collection_sort_order')
                .eq('collection_id', collectionId)
                .order('collection_sort_order', { ascending: true, nullsFirst: true });

            if (!error && data) {
                activeCollectionTracks = data;
                renderModalTracks();
                document.getElementById('reorder-modal').classList.remove('hidden');
            } else {
                alert('Could not load tracks for this collection.');
            }
        }

        function closeReorderModal() {
            document.getElementById('reorder-modal').classList.add('hidden');
            activeCollectionId = null;
            activeCollectionTracks = [];
        }

        function closeReorderModalOnOutside(e) {
            if (e.target.id === 'reorder-modal') closeReorderModal();
        }

        function renderModalTracks() {
            const container = document.getElementById('modal-track-list');
            container.innerHTML = '';

            if (activeCollectionTracks.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888; font-size:12px; margin:20px 0;">No tracks assigned to this collection yet. Add tracks via the upload portal.</p>';
                return;
            }

            activeCollectionTracks.forEach((track, index) => {
                const card = document.createElement('div');
                card.className = 'track-drag-card';
                card.draggable = true;
                card.setAttribute('data-index', index);

                card.innerHTML = `
                    <span class="drag-handle">☰</span>
                    <img src="${track.artwork_url || ''}" alt="Art">
                    <div class="track-drag-info">
                        <div class="track-drag-title">${track.title}</div>
                    </div>
                `;

                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('dragleave', handleDragLeave);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);

                container.appendChild(card);
            });
        }

        function handleDragStart(e) {
            draggedIndex = parseInt(this.getAttribute('data-index'));
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetIndex = parseInt(this.getAttribute('data-index'));
            
            if (draggedIndex !== null && draggedIndex !== targetIndex) {
                const movedItem = activeCollectionTracks.splice(draggedIndex, 1)[0];
                activeCollectionTracks.splice(targetIndex, 0, movedItem);
                renderModalTracks();
                saveCollectionOrder(true); // Auto-save on drop silently
            }
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            document.querySelectorAll('.track-drag-card').forEach(c => c.classList.remove('drag-over'));
        }

        async function saveCollectionOrder(isSilent = false) {
            if (!activeCollectionId) return;

            let updates = activeCollectionTracks.map((track, index) => {
                return _supabase.from('tracks').update({ collection_sort_order: index + 1 }).eq('id', track.id);
            });

            try {
                await Promise.all(updates);
                if (!isSilent) {
                    alert('Collection track order saved successfully!');
                    closeReorderModal();
                }
            } catch (err) {
                console.error(err);
                if (!isSilent) alert('Error saving collection order.');
            }
        }

        init();
    </script>
</body>
</html>
