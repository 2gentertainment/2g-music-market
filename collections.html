<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2G Entertainment - Upload Track</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Security Guard: Check session authentication
        if (sessionStorage.getItem('2g_admin_auth') !== 'true') {
            window.location.href = 'adminhub.html';
        }

        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .admin-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 440px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
            max-height: 90vh;
            overflow-y: auto;
        }
        h2 { color: #ff8c00; text-align: center; margin-top: 0; font-size: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; color: #aaa; }
        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus { border-color: #ff8c00; outline: none; }
        button {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            margin-top: 10px;
        }
        button:hover { background-color: #e07b00; }
        #status-msg { text-align: center; margin-top: 12px; font-size: 13px; color: #ff8c00; }
        .link-back { display: block; text-align: center; margin-top: 15px; font-size: 12px; color: #888; text-decoration: none; }
        .link-back:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Upload New Track</h2>

        <div class="form-group">
            <label>Track Title</label>
            <input type="text" id="track-title" placeholder="Song Name">
        </div>

        <div class="form-group">
            <label>Artist</label>
            <select id="artist-select">
                <option value="">-- Select Artist --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Album / Collection (Optional)</label>
            <select id="track-collection">
                <option value="">-- Standalone Single (No Album) --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Audio File (.mp3 / .wav)</label>
            <input type="file" id="audio-file" accept="audio/*">
        </div>

        <div class="form-group">
            <label>Artwork Image (.jpg / .png)</label>
            <input type="file" id="artwork-file" accept="image/*">
        </div>

        <div class="form-group">
            <label>Apple Music URL</label>
            <input type="text" id="apple-url" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Spotify URL</label>
            <input type="text" id="spotify-url" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Tidal URL</label>
            <input type="text" id="tidal-url" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>YouTube URL</label>
            <input type="text" id="youtube-url" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Pandora URL</label>
            <input type="text" id="pandora-url" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Store Single URL</label>
            <input type="text" id="store-single-url" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Store Album / Project URL</label>
            <input type="text" id="store-album-url" placeholder="https://...">
        </div>

        <button onclick="uploadTrack()">Upload Track</button>
        <p id="status-msg"></p>

        <a href="adminhub.html" class="link-back">← Back to Master Admin Hub</a>
    </div>

    <script>
        async function init() {
            await loadArtists();
            await loadCollections();
        }

        async function loadArtists() {
            const { data, error } = await _supabase.from('artists').select('id, name').order('name');
            if (!error && data) {
                const select = document.getElementById('artist-select');
                data.forEach(artist => {
                    select.innerHTML += `<option value="${artist.id}">${artist.name}</option>`;
                });
            }
        }

        async function loadCollections() {
            const { data, error } = await _supabase
                .from('collections')
                .select('id, title, type')
                .eq('is_visible', true)
                .order('title', { ascending: true });

            if (!error && data) {
                const select = document.getElementById('track-collection');
                data.forEach(col => {
                    const label = col.type === 'album' ? `Album: ${col.title}` : `Playlist: ${col.title}`;
                    select.innerHTML += `<option value="${col.id}">${label}</option>`;
                });
            }
        }

        async function uploadTrack() {
            const title = document.getElementById('track-title').value.trim();
            const artistId = document.getElementById('artist-select').value;
            const collectionId = document.getElementById('track-collection').value;
            const audioFile = document.getElementById('audio-file').files[0];
            const artworkFile = document.getElementById('artwork-file').files[0];
            const statusMsg = document.getElementById('status-msg');

            if (!title || !artistId || !audioFile) {
                alert('Please enter a title, select an artist, and choose an audio file.');
                return;
            }

            statusMsg.innerText = 'Uploading audio file...';

            // 1. Upload Audio
            const audioFileName = `${Date.now()}_${audioFile.name}`;
            const { data: audioData, error: audioError } = await _supabase.storage
                .from('audio_files')
                .upload(audioFileName, audioFile);

            if (audioError) {
                statusMsg.innerText = 'Audio upload error: ' + audioError.message;
                return;
            }

            const { data: audioPublicUrl } = _supabase.storage
                .from('audio_files')
                .getPublicUrl(audioFileName);

            // 2. Upload Artwork (if provided)
            let artworkPublicUrl = '';
            if (artworkFile) {
                statusMsg.innerText = 'Uploading artwork...';
                const artFileName = `${Date.now()}_${artworkFile.name}`;
                const { error: artError } = await _supabase.storage
                    .from('artwork')
                    .upload(artFileName, artworkFile);

                if (!artError) {
                    const { data: artPub } = _supabase.storage
                        .from('artwork')
                        .getPublicUrl(artFileName);
                    artworkPublicUrl = artPub.publicUrl;
                }
            }

            statusMsg.innerText = 'Saving to database...';

            // 3. Insert Track Record with collection_id
            const { error: dbError } = await _supabase.from('tracks').insert([{
                title: title,
                artist_id: parseInt(artistId),
                collection_id: collectionId ? parseInt(collectionId) : null,
                audio_file_path: audioPublicUrl.publicUrl,
                artwork_url: artworkPublicUrl,
                apple_music_url: document.getElementById('apple-url').value.trim(),
                spotify_url: document.getElementById('spotify-url').value.trim(),
                tidal_url: document.getElementById('tidal-url').value.trim(),
                youtube_url: document.getElementById('youtube-url').value.trim(),
                pandora_url: document.getElementById('pandora-url').value.trim(),
                store_single_url: document.getElementById('store-single-url').value.trim(),
                store_album_url: document.getElementById('store-album-url').value.trim(),
                sort_order: 99
            }]);

            if (dbError) {
                statusMsg.innerText = 'Database error: ' + dbError.message;
                return;
            }

            statusMsg.innerText = 'Track uploaded and assigned successfully!';
            setTimeout(() => { location.reload(); }, 2000);
        }

        init();
    </script>
</body>
</html>
