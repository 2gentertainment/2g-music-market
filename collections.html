<!DOCTYPE html>
<html lang="en">
<span hidden>Sumter, South Carolina</span>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2G Entertainment - Manage Playlists & Albums</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Security Guard: Strict session check
        if (sessionStorage.getItem('2g_admin_auth') !== 'true') {
            window.location.href = 'adminhub.html';
        }

        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .admin-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
            max-height: 90vh;
            overflow-y: auto;
        }
        h2 { color: #ff8c00; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #e07b00; }
        
        .collection-list {
            margin-top: 25px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        .collection-item {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .collection-info div:first-child { font-weight: bold; font-size: 14px; color: #fff; }
        .collection-info div:last-child { font-size: 11px; color: #ff8c00; text-transform: uppercase; margin-top: 3px; }
        
        .collection-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .small-btn {
            padding: 6px 8px;
            font-size: 11px;
            width: auto;
            margin: 0;
        }
        .manage-btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
        }
        .manage-btn:hover { background-color: #383838; }

        .delete-btn {
            background-color: #331a1a;
            color: #ff4d4d;
            border: 1px solid #552222;
        }
        .delete-btn:hover { background-color: #441a1a; }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            width: 420px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;
        }
        .modal-header h3 { margin: 0; font-size: 16px; color: #ff8c00; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer; width: auto; padding: 0; margin: 0;}
        
        .modal-track-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .modal-track-row {
            background: #252525;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .modal-track-info div:first-child { font-size: 13px; font-weight: bold; color: #fff; }
        .modal-track-info div:last-child { font-size: 11px; color: #aaa; }

        #status-msg { text-align: center; margin-top: 15px; font-size: 13px; color: #ff8c00; }
        .back-link { display: block; text-align: center; margin-top: 15px; font-size: 12px; color: #888; text-decoration: none; }
        .back-link:hover { color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>Manage Playlists & Albums</h2>
        
        <!-- Create Collection Form -->
        <div class="form-group">
            <label>Collection Title</label>
            <input type="text" id="collection-title" placeholder="e.g., Summer Mixtape or Album Name">
        </div>

        <div class="form-group">
            <label>Type</label>
            <select id="collection-type">
                <option value="playlist">Playlist (Curated Tab)</option>
                <option value="album">Album (Artist Project)</option>
            </select>
        </div>

        <div class="form-group" id="artist-select-group">
            <label>Associated Artist (Optional for Albums)</label>
            <select id="artist-select">
                <option value="">-- None / General --</option>
            </select>
        </div>

        <button onclick="createCollection()">Create Collection</button>
        <p id="status-msg"></p>

        <!-- Existing Collections List -->
        <div class="collection-list">
            <label style="margin-bottom: 10px; font-weight: bold; color: #fff;">Existing Collections</label>
            <div id="collections-container">
                <p style="text-align:center; color:#888; font-size:13px;">Loading collections...</p>
            </div>
        </div>

        <a href="adminhub.html" class="back-link">← Back to Master Admin Hub</a>
    </div>

    <!-- Track Management Modal -->
    <div id="track-modal" class="modal-overlay hidden" onclick="closeModalOnOutside(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Manage Tracks</h3>
                <button class="close-btn" onclick="closeTrackModal()">&times;</button>
            </div>
            <p style="font-size: 12px; color: #aaa; margin-top:0;">Assign or remove songs for this collection:</p>
            <div id="modal-tracks-container" class="modal-track-list">
                <!-- Tracks dynamically loaded here -->
            </div>
        </div>
    </div>

    <script>
        let artistsList = [];
        let allTracks = [];
        let activeCollectionId = null;

        async function init() {
            await loadArtists();
            await loadAllTracks();
            await loadCollections();
        }

        async function loadArtists() {
            const { data, error } = await _supabase.from('artists').select('id, name').order('name');
            if (!error && data) {
                artistsList = data;
                const select = document.getElementById('artist-select');
                data.forEach(artist => {
                    select.innerHTML += `<option value="${artist.id}">${artist.name}</option>`;
                });
            }
        }

        async function loadAllTracks() {
            const { data, error } = await _supabase.from('tracks').select('id, title, collection_id, artist_id, artists(name)').order('title');
            if (!error && data) {
                allTracks = data;
            }
        }

        async function loadCollections() {
            const container = document.getElementById('collections-container');
            const { data, error } = await _supabase
                .from('collections')
                .select('id, title, type, is_visible, sort_order, artist_id')
                .order('sort_order', { ascending: true, nullsFirst: true });

            if (error) {
                container.innerHTML = `<p style="color:red; text-align:center; font-size:12px;">Error: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888; font-size:12px;">No collections created yet.</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(item => {
                const artistObj = artistsList.find(a => a.id === item.artist_id);
                const subtitle = artistObj ? `${item.type} • ${artistObj.name}` : item.type;
                const visibilityText = item.is_visible ? '👁️ Visible' : '🔒 Hidden';

                const card = document.createElement('div');
                card.className = 'collection-item';
                card.innerHTML = `
                    <div class="collection-info">
                        <div>${item.title}</div>
                        <div>${subtitle}</div>
                    </div>
                    <div class="collection-actions">
                        <button class="manage-btn small-btn" onclick="openTrackModal(${item.id}, '${item.title.replace(/'/g, "\\'")}')">Songs</button>
                        <button class="secondary-btn small-btn" onclick="toggleVisibility(${item.id}, ${item.is_visible})">${visibilityText}</button>
                        <button class="delete-btn small-btn" onclick="deleteCollection(${item.id})">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function createCollection() {
            const title = document.getElementById('collection-title').value.trim();
            const type = document.getElementById('collection-type').value;
            const artistId = document.getElementById('artist-select').value || null;
            const statusMsg = document.getElementById('status-msg');

            if (!title) {
                alert('Please enter a collection title.');
                return;
            }

            statusMsg.innerText = 'Creating collection...';

            const { error } = await _supabase
                .from('collections')
                .insert([{
                    title: title,
                    type: type,
                    artist_id: artistId ? parseInt(artistId) : null,
                    is_visible: true,
                    sort_order: 99
                }]);

            if (error) {
                console.error(error);
                statusMsg.innerText = 'Error: ' + error.message;
                return;
            }

            statusMsg.innerText = 'Collection created successfully!';
            document.getElementById('collection-title').value = '';
            await loadCollections();
            setTimeout(() => { statusMsg.innerText = ''; }, 2500);
        }

        async function toggleVisibility(id, currentStatus) {
            const { error } = await _supabase
                .from('collections')
                .update({ is_visible: !currentStatus })
                .eq('id', id);

            if (error) {
                alert('Error updating visibility: ' + error.message);
            } else {
                await loadCollections();
            }
        }

        async function deleteCollection(id) {
            if (!confirm('Are you sure you want to delete this collection?')) return;

            // Unlink tracks first
            await _supabase.from('tracks').update({ collection_id: null }).eq('collection_id', id);

            const { error } = await _supabase
                .from('collections')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Error deleting collection: ' + error.message);
            } else {
                await loadAllTracks();
                await loadCollections();
            }
        }

        // Modal Track Management Functions
        async function openTrackModal(collectionId, collectionTitle) {
            activeCollectionId = collectionId;
            document.getElementById('modal-title').innerText = `Songs in: ${collectionTitle}`;
            document.getElementById('track-modal').classList.remove('hidden');
            await renderModalTracks();
        }

        function closeTrackModal() {
            document.getElementById('track-modal').classList.add('hidden');
            activeCollectionId = null;
        }

        function closeModalOnOutside(e) {
            if (e.target.id === 'track-modal') closeTrackModal();
        }

        async function renderModalTracks() {
            await loadAllTracks(); // Refresh track list cache
            const container = document.getElementById('modal-tracks-container');
            container.innerHTML = '';

            if (allTracks.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888; font-size:13px;">No tracks available in catalog.</p>';
                return;
            }

            allTracks.forEach(track => {
                const isAssigned = track.collection_id === activeCollectionId;
                const artistName = track.artists ? track.artists.name : 'Unknown Artist';

                const row = document.createElement('div');
                row.className = 'modal-track-row';
                row.innerHTML = `
                    <div class="modal-track-info">
                        <div>${track.title}</div>
                        <div>${artistName}</div>
                    </div>
                    <div>
                        ${isAssigned 
                            ? `<button class="delete-btn small-btn" onclick="assignTrackToCollection(${track.id}, null)">Remove</button>`
                            : `<button class="small-btn" style="background:#ff8c00; color:#000;" onclick="assignTrackToCollection(${track.id}, ${activeCollectionId})">Add</button>`
                        }
                    </div>
                `;
                container.appendChild(row);
            });
        }

        async function assignTrackToCollection(trackId, collectionId) {
            const { error } = await _supabase
                .from('tracks')
                .update({ collection_id: collectionId })
                .eq('id', trackId);

            if (error) {
                alert('Error updating track assignment: ' + error.message);
            } else {
                await renderModalTracks();
            }
        }

        init();
    </script>
</body>
</html>
