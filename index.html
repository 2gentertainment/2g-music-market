    <script>
        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let playlist = [];
        let currentIndex = 0;
        let isShuffled = false;
        let isRepeated = false;
        
        const audioElement = document.getElementById('audio-element');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');

        async function loadTracks() {
            const { data, error } = await _supabase
                .from('tracks')
                .select('title, audio_file_path, artwork_url, artists(name, aweber_tag)');

            if (error) {
                console.error('Error loading tracks:', error);
                document.getElementById('track-title').innerText = 'Error loading tracks';
                return;
            }

            if (data && data.length > 0) {
                playlist = data;
                loadTrackData(0); // Load metadata and set initial paused state cleanly
            } else {
                document.getElementById('track-title').innerText = 'No tracks found';
            }
        }

        function loadTrackData(index) {
            currentIndex = index;
            const track = playlist[currentIndex];

            document.getElementById('track-title').innerText = track.title;
            document.getElementById('artist-name').innerText = track.artists ? track.artists.name : '2G Entertainment';
            document.getElementById('track-artwork').src = track.artwork_url || '';
            
            audioElement.src = track.audio_file_path;
            updatePlayButton(); // Ensure icon reflects paused state on load
        }

        function playTrack(index) {
            currentIndex = index;
            const track = playlist[currentIndex];

            document.getElementById('track-title').innerText = track.title;
            document.getElementById('artist-name').innerText = track.artists ? track.artists.name : '2G Entertainment';
            document.getElementById('track-artwork').src = track.artwork_url || '';
            
            audioElement.src = track.audio_file_path;
            audioElement.play().then(() => {
                updatePlayButton();
            }).catch(err => {
                console.log("Autoplay blocked by browser policy, waiting for user interaction:", err);
                updatePlayButton();
            });
        }

        function togglePlay() {
            if (audioElement.paused) {
                audioElement.play().then(() => {
                    updatePlayButton();
                });
            } else {
                audioElement.pause();
                updatePlayButton();
            }
        }

        // Dynamically inspects the audio element's real state so icons never mismatch
        function updatePlayButton() {
            if (!audioElement.paused) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            
            if (isShuffled) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * playlist.length);
                } while (randomIndex === currentIndex && playlist.length > 1);
                currentIndex = randomIndex;
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            playTrack(currentIndex);
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentIndex);
        }

        function toggleShuffle() {
            isShuffled = !isShuffled;
            document.getElementById('shuffle-btn').classList.toggle('active', isShuffled);
        }

        function toggleRepeat() {
            isRepeated = !isRepeated;
            document.getElementById('repeat-btn').classList.toggle('active', isRepeated);
        }

        audioElement.addEventListener('play', updatePlayButton);
        audioElement.addEventListener('pause', updatePlayButton);

        audioElement.addEventListener('ended', () => {
            if (isRepeated) {
                audioElement.currentTime = 0;
                audioElement.play();
            } else {
                nextTrack();
            }
        });

        function revealSubscribeForm() {
            document.getElementById('become-fan-btn').classList.add('hidden');
            document.getElementById('subscribe-form-box').classList.remove('hidden');
            document.getElementById('subscriber-email').focus();
        }

        async function submitSubscriber() {
            const email = document.getElementById('subscriber-email').value.trim();
            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address.');
                return;
            }

            const currentTrack = playlist[currentIndex];
            const tag = currentTrack && currentTrack.artists ? currentTrack.artists.aweber_tag : '2g-general';

            alert(`Thanks for joining! Tagged as: ${tag}`);
            document.getElementById('subscriber-email').value = '';
        }

        loadTracks();
    </script>
