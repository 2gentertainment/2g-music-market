    <style>
        html, body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; /* Adapts dynamically to mobile toolbars */
            margin: 0;
            overflow: hidden;
        }
        .player-card {
            background: #1e1e1e;
            padding: 16px;
            border-radius: 16px;
            width: 340px;
            max-height: 92dvh; /* Ensures it never overflows vertically */
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #333;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        .artwork-container {
            width: 100%;
            max-height: 220px; /* Snug height so everything centers cleanly */

            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .artwork-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keeps full artwork uncropped */
            display: block;
        }
        h3 { margin: 6px 0 2px 0; font-size: 16px; color: #fff; }
        p { margin: 0 0 10px 0; font-size: 13px; color: #ff8c00; }
        
        /* Progress Bar Styles */
        .progress-container {
            width: 100%;
            margin-bottom: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff8c00;
            cursor: pointer;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }

        .subscribe-section { margin-bottom: 12px; }
        .main-sub-btn {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .main-sub-btn:hover { background-color: #e07b00; }
        
        .sub-form {
            display: flex;
            gap: 8px;
        }

            flex: 1;
            padding: 8px;

            color: #fff;

            color: #000;

            padding: 0 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }
        .controls button {
            background: #2a2a2a;
            border: none;
            color: #aaa;

            height: 36px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls button:hover { background: #3a3a3a; color: #fff; }
        
        .controls button.active {
            color: #ff8c00;
            background: #2a1f12;
            border: 1px solid #ff8c00;

            background: #ff8c00;
            color: #000;
            width: 46px;
