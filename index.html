<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2G Entertainment - Music Player</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        
        .player-card {
            background: #121212;
            width: 100%;
            max-width: 480px;
            height: 100%;
            box-sizing: border-box;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto; /* Allows smooth scrolling of the whole card/tracklist view */
        }

        .player-header {
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
            padding-top: 5px;
            flex-shrink: 0;
        }

        /* Seamless Edge-to-Edge Artwork */
        .artwork-container {
            width: 100%;
            max-height: 35vh;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0;
            flex-shrink: 0;
        }
        .artwork-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        h3 { margin: 0 0 4px 0; font-size: 18px; color: #fff; font-weight: 700; }
        p { margin: 0; font-size: 13px; color: #ff8c00; font-weight: 500; }
        
        /* Progress Bar Styles */
        .progress-container {
            width: 100%;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff8c00;
            cursor: pointer;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .action-section { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 12px; 
            flex-shrink: 0;
        }
        .main-sub-btn {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .main-sub-btn:hover { background-color: #e07b00; }

        .stream-trigger-btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .stream-trigger-btn:hover { background-color: #3a3a3a; border-color: #ff8c00; }
        
        .sub-form {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .sub-form input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px;
        }
        .sub-form button {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 0 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
        }

        /* Inline Scrollable Playlist Section */
        .inline-playlist-section {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            max-height: 180px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .inline-playlist-header {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .inline-tracks-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Playlist Item Design (Shared for inline & modal) */
        .playlist-item {
            background: #222;
            padding: 8px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid #333;
            transition: background 0.2s, border-color 0.2s;
            text-align: left;
        }
        .playlist-item:hover {
            background: #2a2a2a;
            border-color: #555;
        }
        .playlist-item.active-track {
            background: #2a1f12;
            border-color: #ff8c00;
        }
        .playlist-item img {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
        }
        .playlist-item-info {
            flex: 1;
            overflow: hidden;
        }
        .playlist-item-title {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .playlist-item-artist {
            font-size: 11px;
            color: #ff8c00;
        }

        /* Modal Drawer Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        .modal-content {
            background: #1a1a1a;
            width: 100%;
            max-width: 480px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px 20px 30px 20px;
            box-sizing: border-box;
            border-top: 1px solid #333;
            text-align: center;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h4 { margin: 0; font-size: 15px; color: #fff; letter-spacing: 0.5px; }
        .close-modal-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }

        .stream-links-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stream-link-item {
            background: #252525;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid #333;
            transition: background 0.2s;
        }
        .stream-link-item:hover { background: #333; border-color: #ff8c00; }

        .playlist-modal-content {
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .playlist-tracks-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
            padding-right: 4px;
        }

        /* Player Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        .controls button {
            background: #1e1e1e;
            border: none;
            color: #aaa;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls button:hover { background: #2e2e2e; color: #fff; }
        
        .controls button.active {
            color: #ff8c00;
            background: #2a1f12;
            border: 1px solid #ff8c00;
        }

        .controls button#play-pause-btn {
            background: #ff8c00;
            color: #000;
            width: 56px;
            height: 56px;
        }
        .controls button#play-pause-btn:hover { background: #e07b00; color: #000; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="player-header">2G Entertainment</div>

        <div class="artwork-container">
            <img id="track-artwork" src="" alt="Artwork">
        </div>

        <div class="track-info">
            <h3 id="track-title">Loading track...</h3>
            <p id="artist-name">2G Entertainment</p>
        </div>

        <!-- Song Progress Bar & Timestamps -->
        <div class="progress-container">
            <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <!-- Become a Fan & Stream Hub Section -->
        <div class="subscribe-container">
            <div id="action-row" class="action-section">
                <button id="become-fan-btn" class="main-sub-btn" onclick="revealSubscribeForm()">BECOME A FAN</button>
                <button id="stream-btn" class="stream-trigger-btn" onclick="openStreamModal()">STREAM</button>
            </div>
            <div id="subscribe-form-box" class="sub-form hidden">
                <input type="email" id="subscriber-email" placeholder="Enter your email...">
                <button onclick="submitSubscriber()">Join</button>
            </div>
        </div>

        <!-- Inline Scrollable Playlist Section (Apple Music / Airbit Style Drawer) -->
        <div class="inline-playlist-section">
            <div class="inline-playlist-header">Up Next / Catalog</div>
            <div id="inline-tracks-container" class="inline-tracks-list">
                <!-- Dynamically populated inline tracks appear here -->
            </div>
        </div>

        <!-- Player Controls (Keeping Thumb-Optimized Play Button Layout) -->
        <div class="controls">
            <button id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>

            <button id="playlist-btn" onclick="openPlaylistModal()" title="Full Playlist View">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>

            <button onclick="prevTrack()" title="Previous">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>
            
            <button id="play-pause-btn" onclick="togglePlay()" title="Play/Pause">
                <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="pause-icon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>

            <button onclick="nextTrack()" title="Next">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>

            <button id="repeat-btn" onclick="toggleRepeat()" title="Repeat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            </button>
        </div>
    </div>

    <!-- Streaming Links Modal Drawer -->
    <div id="stream-modal" class="modal-overlay hidden" onclick="closeStreamModalOnOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h4>LISTEN ON</h4>
                <button class="close-modal-btn" onclick="closeStreamModal()">&times;</button>
            </div>
            <div id="stream-links-container" class="stream-links-grid"></div>
        </div>
    </div>

    <!-- Popup Playlist Drawer Modal (Triggered by button) -->
    <div id="playlist-modal" class="modal-overlay hidden" onclick="closePlaylistModalOnOutside(event)">
        <div class="modal-content playlist-modal-content">
            <div class="modal-header">
                <h4>PLAYLIST (<span id="playlist-count">0</span>)</h4>
                <button class="close-modal-btn" onclick="closePlaylistModal()">&times;</button>
            </div>
            <div id="playlist-tracks-container" class="playlist-tracks-list"></div>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let playlist = [];
        let currentIndex = 0;
        let isShuffled = false;
        let isRepeated = false;
        
        const audioElement = document.getElementById('audio-element');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        async function loadTracks() {
            const { data, error } = await _supabase
                .from('tracks')
                .select('title, audio_file_path, artwork_url, apple_music_url, spotify_url, tidal_url, youtube_url, pandora_url, artists(name, aweber_tag)');

            if (error) {
                console.error('Error loading tracks:', error);
                document.getElementById('track-title').innerText = 'Error loading tracks';
                return;
            }

            if (data && data.length > 0) {
                playlist = data;
                loadTrackData(0);
                renderInlinePlaylist(); // Populates the scrollable drawer on the main page
            } else {
                document.getElementById('track-title').innerText = 'No tracks found';
            }
        }

        function loadTrackData(index) {
            currentIndex = index;
            const track = playlist[currentIndex];

            document.getElementById('track-title').innerText = track.title;
            document.getElementById('artist-name').innerText = track.artists ? track.artists.name : '2G Entertainment';
            document.getElementById('track-artwork').src = track.artwork_url || '';
            
            audioElement.src = track.audio_file_path;
            progressBar.value = 0;
            currentTimeEl.innerText = "0:00";
            totalDurationEl.innerText = "0:00";
            
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            
            highlightActiveTracks(); // Updates active state across both views
        }

        function playTrack(index) {
            currentIndex = index;
            const track = playlist[currentIndex];

            document.getElementById('track-title').innerText = track.title;
            document.getElementById('artist-name').innerText = track.artists ? track.artists.name : '2G Entertainment';
            document.getElementById('track-artwork').src = track.artwork_url || '';
            
            audioElement.src = track.audio_file_path;
            audioElement.play().then(() => {
                updatePlayButton();
            }).catch(err => {
                console.log("Autoplay waiting for user interaction");
                updatePlayButton();
            });

            highlightActiveTracks();
        }

        function togglePlay() {
            if (audioElement.paused) {
                audioElement.play().then(() => {
                    updatePlayButton();
                });
            } else {
                audioElement.pause();
                updatePlayButton();
            }
        }

        function updatePlayButton() {
            if (!audioElement.paused) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.innerText = formatTime(audioElement.currentTime);
                totalDurationEl.innerText = formatTime(audioElement.duration);
            }
        });

        function seekAudio(value) {
            if (audioElement.duration) {
                const seekTime = (value / 100) * audioElement.duration;
                audioElement.currentTime = seekTime;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            
            if (isShuffled) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * playlist.length);
                } while (randomIndex === currentIndex && playlist.length > 1);
                currentIndex = randomIndex;
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            playTrack(currentIndex);
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentIndex);
        }

        function toggleShuffle() {
            isShuffled = !isShuffled;
            document.getElementById('shuffle-btn').classList.toggle('active', isShuffled);
        }

        function toggleRepeat() {
            isRepeated = !isRepeated;
            document.getElementById('repeat-btn').classList.toggle('active', isRepeated);
        }

        audioElement.addEventListener('play', updatePlayButton);
        audioElement.addEventListener('pause', updatePlayButton);

        audioElement.addEventListener('ended', () => {
            if (isRepeated) {
                audioElement.currentTime = 0;
                audioElement.play();
            } else {
                nextTrack();
            }
        });

        function revealSubscribeForm() {
            document.getElementById('action-row').classList.add('hidden');
            document.getElementById('subscribe-form-box').classList.remove('hidden');
            document.getElementById('subscriber-email').focus();
        }

        async function submitSubscriber() {
            const email = document.getElementById('subscriber-email').value.trim();
            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address.');
                return;
            }

            const currentTrack = playlist[currentIndex];
            const tag = currentTrack && currentTrack.artists ? currentTrack.artists.aweber_tag : '2g-general';

            alert(`Thanks for joining! Tagged as: ${tag}`);
            document.getElementById('subscriber-email').value = '';
            document.getElementById('subscribe-form-box').classList.add('hidden');
            document.getElementById('action-row').classList.remove('hidden');
        }

        /* Render Inline Scrollable Playlist Drawer */
        function renderInlinePlaylist() {
            const container = document.getElementById('inline-tracks-container');
            container.innerHTML = '';

            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentIndex ? 'active-track' : ''}`;
                item.id = `inline-track-${index}`;
                item.onclick = () => playTrack(index);

                const artSrc = track.artwork_url || '';
                const artistName = track.artists ? track.artists.name : '2G Entertainment';

                item.innerHTML = `
                    <img src="${artSrc}" alt="Art">
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${track.title}</div>
                        <div class="playlist-item-artist">${artistName}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        /* Highlight Active Track across both Inline & Modal views */
        function highlightActiveTracks() {
            document.querySelectorAll('.playlist-item').forEach((el, index) => {
                // Determine active status based on loop index check or matching IDs
                // Simplified: re-render inline or toggle class
            });
            renderInlinePlaylist();
        }

        /* Streaming Modal Drawer Logic */
        function openStreamModal() {
            const track = playlist[currentIndex];
            const container = document.getElementById('stream-links-container');
            container.innerHTML = '';

            const platforms = [
                { name: 'Apple Music', url: track.apple_music_url },
                { name: 'Spotify', url: track.spotify_url },
                { name: 'Tidal', url: track.tidal_url },
                { name: 'YouTube', url: track.youtube_url },
                { name: 'Pandora', url: track.pandora_url }
            ];

            let validLinksCount = 0;
            platforms.forEach(platform => {
                if (platform.url && platform.url.trim() !== '') {
                    validLinksCount++;
                    const a = document.createElement('a');
                    a.href = platform.url;
                    a.target = '_blank';
                    a.className = 'stream-link-item';
                    a.innerText = platform.name;
                    container.appendChild(a);
                }
            });

            if (validLinksCount === 0) {
                container.innerHTML = '<p style="color: #888; font-size: 14px; margin: 10px 0;">No streaming links available for this track yet.</p>';
            }

            document.getElementById('stream-modal').classList.remove('hidden');
        }

        function closeStreamModal() {
            document.getElementById('stream-modal').classList.add('hidden');
        }

        function closeStreamModalOnOutside(event) {
            if (event.target.id === 'stream-modal') closeStreamModal();
        }

        /* Popup Playlist Modal Drawer Logic */
        function openPlaylistModal() {
            const container = document.getElementById('playlist-tracks-container');
            const countEl = document.getElementById('playlist-count');
            container.innerHTML = '';
            countEl.innerText = playlist.length;

            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentIndex ? 'active-track' : ''}`;
                item.onclick = () => {
                    playTrack(index);
                    closePlaylistModal();
                };

                const artSrc = track.artwork_url || '';
                const artistName = track.artists ? track.artists.name : '2G Entertainment';

                item.innerHTML = `
                    <img src="${artSrc}" alt="Art">
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${track.title}</div>
                        <div class="playlist-item-artist">${artistName}</div>
                    </div>
                `;
                container.appendChild(item);
            });

            document.getElementById('playlist-modal').classList.remove('hidden');
        }

        function closePlaylistModal() {
            document.getElementById('playlist-modal').classList.add('hidden');
        }

        function closePlaylistModalOnOutside(event) {
            if (event.target.id === 'playlist-modal') closePlaylistModal();
        }

        loadTracks();
    </script>
</body>
</html>
