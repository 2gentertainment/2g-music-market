<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2G Entertainment - Music Player</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        
        /* Full-screen immersive player container */
        .player-card {
            background: #121212;
            width: 100%;
            max-width: 480px;
            height: 100%;
            box-sizing: border-box;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top header / brand placeholder if needed */
        .player-header {
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
            padding-top: 5px;
        }

        /* Uncropped Full Artwork Display */
        .artwork-container {
            width: 100%;
            flex: 1;
            max-height: 42vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }
        .artwork-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Full uncropped dimensions guaranteed */
            display: block;
        }

        .track-info {
            text-align: center;
            margin-bottom: 15px;
        }
        h3 { margin: 0 0 4px 0; font-size: 20px; color: #fff; font-weight: 700; }
        p { margin: 0; font-size: 14px; color: #ff8c00; font-weight: 500; }
        
        /* Progress Bar Styles */
        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff8c00;
            cursor: pointer;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }

        .subscribe-section { margin-bottom: 20px; }
        .main-sub-btn {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .main-sub-btn:hover { background-color: #e07b00; }
        
        .sub-form {
            display: flex;
            gap: 10px;
        }
        .sub-form input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px; /* Prevents mobile auto-zoom */
            transform: scale(1);
            touch-action: manipulation;
        }
        .sub-form button {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 0 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
        }
        .controls button {
            background: #1e1e1e;
            border: none;
            color: #aaa;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls button:hover { background: #2e2e2e; color: #fff; }
        
        .controls button.active {
            color: #ff8c00;
            background: #2a1f12;
            border: 1px solid #ff8c00;
        }

        .controls button#play-pause-btn {
            background: #ff8c00;
            color: #000;
            width: 60px;
            height: 60px;
        }
        .controls button#play-pause-btn:hover { background: #e07b00; color: #000; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="player-header">2G Entertainment</div>

        <div class="artwork-container">
            <img id="track-artwork" src="" alt="Artwork">
        </div>

        <div class="track-info">
            <h3 id="track-title">Loading track...</h3>
            <p id="artist-name">2G Entertainment</p>
        </div>

        <!-- Song Progress Bar & Timestamps -->
        <div class="progress-container">
            <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <!-- Become a Fan / Subscribe Section -->
        <div class="subscribe-section">
            <button id="become-fan-btn" class="main-sub-btn" onclick="revealSubscribeForm()">BECOME A FAN</button>
            <div id="subscribe-form-box" class="sub-form hidden">
                <input type="email" id="subscriber-email" placeholder="Enter your email...">
                <button onclick="submitSubscriber()">Join</button>
            </div>
        </div>

        <!-- Player Controls -->
        <div class="controls">
            <button id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>

            <button onclick="prevTrack()" title="Previous">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>
            
            <button id="play-pause-btn" onclick="togglePlay()" title="Play/Pause">
                <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="pause-icon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>

            <button onclick="nextTrack()" title="Next">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>

            <button id="repeat-btn" onclick="toggleRepeat()" title="Repeat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            </button>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let playlist = [];
        let currentIndex = 0;
        let isShuffled = false;
        let isRepeated = false;
        
        const audioElement = document.getElementById('audio-element');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        async function loadTracks() {
            const { data, error } = await _supabase
                .from('tracks')
                .select('title, audio_file_path, artwork_url, artists(name, aweber_tag)');

            if (error) {
                console.error('Error loading tracks:', error);
                document.getElementById('track-title').innerText = 'Error loading tracks';
                return;
            }

            if (data && data.length > 0) {
                playlist = data;
                loadTrackData(0);
            } else {
                document.getElementById('track-title').innerText = 'No tracks found';
            }
        }

        function loadTrackData(index) {
            currentIndex = index;
            const track = playlist[currentIndex];

            document.getElementById('track-title').innerText = track.title;
            document.getElementById('artist-name').innerText = track.artists ? track.artists.name : '2G Entertainment';
            document.getElementById('track-artwork').src = track.artwork_url || '';
            
            audioElement.src = track.audio_file_path;
            progressBar.value = 0;
            currentTimeEl.innerText = "0:00";
            totalDurationEl.innerText = "0:00";
            
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
        }

        function playTrack(index) {
            currentIndex = index;
            const track = playlist[currentIndex];

            document.getElementById('track-title').innerText = track.title;
            document.getElementById('artist-name').innerText = track.artists ? track.artists.name : '2G Entertainment';
            document.getElementById('track-artwork').src = track.artwork_url || '';
            
            audioElement.src = track.audio_file_path;
            audioElement.play().then(() => {
                updatePlayButton();
            }).catch(err => {
                console.log("Autoplay waiting for user interaction");
                updatePlayButton();
            });
        }

        function togglePlay() {
            if (audioElement.paused) {
                audioElement.play().then(() => {
                    updatePlayButton();
                });
            } else {
                audioElement.pause();
                updatePlayButton();
            }
        }

        function updatePlayButton() {
            if (!audioElement.paused) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.innerText = formatTime(audioElement.currentTime);
                totalDurationEl.innerText = formatTime(audioElement.duration);
            }
        });

        function seekAudio(value) {
            if (audioElement.duration) {
                const seekTime = (value / 100) * audioElement.duration;
                audioElement.currentTime = seekTime;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            
            if (isShuffled) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * playlist.length);
                } while (randomIndex === currentIndex && playlist.length > 1);
                currentIndex = randomIndex;
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            playTrack(currentIndex);
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentIndex);
        }

        function toggleShuffle() {
            isShuffled = !isShuffled;
            document.getElementById('shuffle-btn').classList.toggle('active', isShuffled);
        }

        function toggleRepeat() {
            isRepeated = !isRepeated;
            document.getElementById('repeat-btn').classList.toggle('active', isRepeated);
        }

        audioElement.addEventListener('play', updatePlayButton);
        audioElement.addEventListener('pause', updatePlayButton);

        audioElement.addEventListener('ended', () => {
            if (isRepeated) {
                audioElement.currentTime = 0;
                audioElement.play();
            } else {
                nextTrack();
            }
        });

        function revealSubscribeForm() {
            document.getElementById('become-fan-btn').classList.add('hidden');
            document.getElementById('subscribe-form-box').classList.remove('hidden');
            document.getElementById('subscriber-email').focus();
        }

        async function submitSubscriber() {
            const email = document.getElementById('subscriber-email').value.trim();
            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address.');
                return;
            }

            const currentTrack = playlist[currentIndex];
            const tag = currentTrack && currentTrack.artists ? currentTrack.artists.aweber_tag : '2g-general';

            alert(`Thanks for joining! Tagged as: ${tag}`);
            document.getElementById('subscriber-email').value = '';
        }

        loadTracks();
    </script>
</body>
</html>
