<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2G Entertainment - Music Player</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #333;
            text-align: center;
        }
        .artwork-container {
            width: 100%;
            height: 280px;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .artwork-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h3 { margin: 10px 0 5px 0; font-size: 18px; color: #fff; }
        p { margin: 0 0 20px 0; font-size: 14px; color: #ff8c00; }
        
        .subscribe-section { margin-bottom: 20px; }
        .main-sub-btn {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .main-sub-btn:hover { background-color: #e07b00; }
        
        .sub-form {
            display: flex;
            gap: 8px;
        }
        .sub-form input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 13px;
        }
        .sub-form button {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 0 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }
        .controls button {
            background: #2a2a2a;
            border: none;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .controls button:hover { background: #3a3a3a; }
        .controls button#play-pause-btn {
            background: #ff8c00;
            color: #000;
            width: 55px;
            height: 55px;
        }
        .controls button#play-pause-btn:hover { background: #e07b00; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="artwork-container">
            <img id="track-artwork" src="" alt="Artwork">
        </div>

        <h3 id="track-title">Loading track...</h3>
        <p id="artist-name">2G Entertainment</p>

        <!-- Become a Fan / Subscribe Section -->
        <div class="subscribe-section">
            <button id="become-fan-btn" class="main-sub-btn" onclick="revealSubscribeForm()">BECOME A FAN</button>
            <div id="subscribe-form-box" class="sub-form hidden">
                <input type="email" id="subscriber-email" placeholder="Enter your email...">
                <button onclick="submitSubscriber()">Join</button>
            </div>
        </div>

        <!-- Player Controls -->
        <div class="controls">
            <button onclick="prevTrack()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>
            
            <button id="play-pause-btn" onclick="togglePlay()">
                <!-- Play Icon -->
                <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <!-- Pause Icon (Hidden by default) -->
                <svg id="pause-icon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>

            <button onclick="nextTrack()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let playlist = [];
        let currentIndex = 0;
        const audioElement = document.getElementById('audio-element');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');

        async function loadTracks() {
            // Fetch tracks joined with artist info
            const { data, error } = await _supabase
                .from('tracks')
                .select('title, audio_file_path, artwork_url, artists(name, aweber_tag)');

            if (error) {
                console.error('Error loading tracks:', error);
                document.getElementById('track-title').innerText = 'Error loading tracks';
                return;
            }

            if (data && data.length > 0) {
                playlist = data;
                playTrack(0);
            } else {
                document.getElementById('track-title').innerText = 'No tracks found';
            }
        }

        function playTrack(index) {
            currentIndex = index;
            const track = playlist[currentIndex];

            document.getElementById('track-title').innerText = track.title;
            document.getElementById('artist-name').innerText = track.artists ? track.artists.name : '2G Entertainment';
            document.getElementById('track-artwork').src = track.artwork_url || '';
            
            audioElement.src = track.audio_file_path;
            audioElement.play();
            updatePlayButton(true);
        }

        function togglePlay() {
            if (audioElement.paused) {
                audioElement.play();
                updatePlayButton(true);
            } else {
                audioElement.pause();
                updatePlayButton(false);
            }
        }

        function updatePlayButton(isPlaying) {
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            playTrack(currentIndex);
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentIndex);
        }

        function revealSubscribeForm() {
            document.getElementById('become-fan-btn').classList.add('hidden');
            document.getElementById('subscribe-form-box').classList.remove('hidden');
        }

        async function submitSubscriber() {
            const email = document.getElementById('subscriber-email').value.trim();
            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address.');
                return;
            }

            // Get current artist's AWeber tag
            const currentTrack = playlist[currentIndex];
            const tag = currentTrack && currentTrack.artists ? currentTrack.artists.aweber_tag : '2g-general';

            alert(`Thanks for joining! Tagged as: ${tag}`);
            document.getElementById('subscriber-email').value = '';
        }

        audioElement.addEventListener('ended', nextTrack);

        // Initialize player on load
        loadTracks();
    </script>
</body>
</html>
