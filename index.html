<!DOCTYPE html>
<html lang="en">
<span hidden>Sumter, South Carolina</span>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2G Music Market - Music Player</title>
    
    <!-- Open Graph Social Preview Meta Tags -->
    <meta property="og:title" id="og-title" content="2G Music Market">
    <meta property="og:description" id="og-desc" content="Powered by 2G Entertainment">
    <meta property="og:image" id="og-image" content="https://www.2g-ent.com/uploads/2/7/5/9/27593217/img-6930_orig.jpeg">
    <meta property="og:url" content="">
    <meta name="twitter:card" content="summary_large_image">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        
        .player-card {
            background: #121212;
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            box-sizing: border-box;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .player-header {
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
            padding-top: 2px;
            flex-shrink: 0;
        }

        /* Balanced Square Artwork */
        .artwork-container {
            width: 160px;
            height: 160px;
            margin: 4px auto;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }
        .artwork-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info {
            text-align: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        h3 { margin: 0 0 2px 0; font-size: 16px; color: #fff; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        p { margin: 0; font-size: 12px; color: #ff8c00; font-weight: 500; }
        
        /* Progress Bar Styles */
        .progress-container {
            width: 100%;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .progress-bar {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff8c00;
            cursor: pointer;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }

        .action-section { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 8px; 
            flex-shrink: 0;
        }
        .main-sub-btn {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 9px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .main-sub-btn:hover { background-color: #e07b00; }

        .stream-trigger-btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 9px 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stream-trigger-btn:hover { background-color: #3a3a3a; border-color: #ff8c00; }

        .buy-trigger-btn {
            background-color: #1b3a2b;
            color: #2ecc71;
            border: 1px solid #27ae60;
            padding: 9px 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
        }
        .buy-trigger-btn:hover { 
            background-color: #27ae60; 
            color: #000;
            border-color: #2ecc71; 
        }
        
        .sub-form {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .sub-form input {
            flex: 1;
            padding: 9px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
        }
        .sub-form button {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 0 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Horizontal Scrolling Category / Artist Tab Bar */
        .category-scroll-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .category-scroll-container::-webkit-scrollbar { display: none; }
        
        .cat-tab {
            background: #1c1c1c;
            border: 1px solid #333;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-tab:hover { background: #2a2a2a; color: #fff; }
        .cat-tab.active-tab {
            background: #ff8c00;
            color: #000;
            border-color: #ff8c00;
        }
        .cat-tab.playlist-tab {
            border-color: #ff8c00;
            color: #ff8c00;
        }
        .cat-tab.playlist-tab.active-tab {
            background: #ff8c00;
            color: #000;
        }

        /* Centered Sub-Menu Bar (Singles vs Albums) */
        .submenu-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .sub-tab {
            background: #1c1c1c;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .sub-tab:hover { background: #2a2a2a; color: #fff; }
        .sub-tab.active-sub {
            background: #ff8c00;
            color: #000;
            border-color: #ff8c00;
        }

        /* Independent Scrollable Inline Playlist Drawer */
        .inline-playlist-section {
            background: #161616;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            flex: 1;
            min-height: 90px;
            overflow-y: auto;
        }
        .inline-tracks-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Playlist / Album Item Design */
        .playlist-item {
            background: #202020;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid #2e2e2e;
            transition: background 0.2s, border-color 0.2s;
            text-align: left;
            position: relative;
        }
        .playlist-item:hover { background: #2a2a2a; border-color: #555; }
        .playlist-item.active-track { background: #2a1f12; border-color: #ff8c00; }
        .playlist-item img {
            width: 32px;
            height: 32px;
            border-radius: 5px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .playlist-item-info { flex: 1; overflow: hidden; }
        .playlist-item-title {
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 1px;
        }
        .playlist-item-artist {
            font-size: 11px;
            color: #ff8c00;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Contextual Active-Track Share Button */
        .track-share-btn {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .track-share-btn:hover { background-color: #e07b00; }

        /* Modal Drawer Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        .modal-content {
            background: #1a1a1a;
            width: 100%;
            max-width: 480px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px 20px 30px 20px;
            box-sizing: border-box;
            border-top: 1px solid #333;
            text-align: center;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h4 { margin: 0; font-size: 15px; color: #fff; letter-spacing: 0.5px; }
        .close-modal-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }

        .stream-links-grid, .store-links-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stream-link-item, .store-link-item {
            background: #252525;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid #333;
            transition: background 0.2s;
        }
        .stream-link-item:hover, .store-link-item:hover { background: #333; border-color: #ff8c00; }
        .store-link-item.album-btn { background: #2a1f12; border-color: #ff8c00; color: #ff8c00; }

        /* Player Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .controls button {
            background: #1e1e1e;
            border: none;
            color: #aaa;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls button:hover { background: #2e2e2e; color: #fff; }
        
        .controls button.active {
            color: #ff8c00;
            background: #2a1f12;
            border: 1px solid #ff8c00;
        }

        .controls button#play-pause-btn {
            background: #ff8c00;
            color: #000;
            width: 50px;
            height: 50px;
        }
        .controls button#play-pause-btn:hover { background: #e07b00; color: #000; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="player-header">2G Music Market</div>

        <div class="artwork-container">
            <img id="track-artwork" src="" alt="Artwork">
        </div>

        <div class="track-info">
            <h3 id="track-title">Loading track...</h3>
            <p id="artist-name">2G Music Market</p>
        </div>

        <!-- Song Progress Bar & Timestamps -->
        <div class="progress-container">
            <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <!-- Become a Fan & Action Row Section -->
        <div class="subscribe-container">
            <div id="action-row" class="action-section">
                <button id="become-fan-btn" class="main-sub-btn" onclick="revealSubscribeForm()">BECOME A FAN</button>
                
                <!-- "STREAM NOW" + Brand Color Rotating Stream Button -->
                <button id="dynamic-stream-btn" class="stream-trigger-btn hidden" onclick="openStreamModal()">
                    <span id="stream-content-display">STREAM NOW</span>
                </button>

                <!-- Conditional Green Purchase Button ("Buy: $price") -->
                <button id="dynamic-buy-btn" class="buy-trigger-btn hidden" onclick="openStoreModal()">
                    <span style="color: #ffffff;">Buy:</span> <span id="buy-price-display"></span>
                </button>
            </div>
            <div id="subscribe-form-box" class="sub-form hidden">
                <input type="email" id="subscriber-email" placeholder="Enter your email...">
                <button onclick="submitSubscriber()">Join</button>
            </div>
        </div>

        <!-- Horizontal Scrolling Category / Artist Tab Bar -->
        <div id="category-tabs" class="category-scroll-container">
            <div class="cat-tab active-tab" onclick="filterCatalog('all', null, this)">All Songs</div>
        </div>

        <!-- Context-Aware Centered Sub-Menu Bar (Singles vs Albums) -->
        <div id="submenu-bar" class="submenu-container hidden"></div>

        <!-- Independent Scrollable Inline Playlist Drawer -->
        <div class="inline-playlist-section">
            <div id="inline-tracks-container" class="inline-tracks-list"></div>
        </div>

        <!-- Player Controls -->
        <div class="controls">
            <button id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>

            <!-- Store Button -->
            <button id="store-btn" onclick="openStoreModal()" title="Store & Purchase">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            </button>

            <button onclick="prevTrack()" title="Previous">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>
            
            <button id="play-pause-btn" onclick="togglePlay()" title="Play/Pause">
                <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="pause-icon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>

            <button onclick="nextTrack()" title="Next">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>

            <button id="repeat-btn" onclick="toggleRepeat()" title="Repeat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            </button>
        </div>
    </div>

    <!-- Streaming Links Modal Drawer -->
    <div id="stream-modal" class="modal-overlay hidden" onclick="closeStreamModalOnOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h4>LISTEN ON</h4>
                <button class="close-modal-btn" onclick="closeStreamModal()">&times;</button>
            </div>
            <div id="stream-links-container" class="stream-links-grid"></div>
        </div>
    </div>

    <!-- Store Links Modal Drawer -->
    <div id="store-modal" class="modal-overlay hidden" onclick="closeStoreModalOnOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h4>GET IT IN THE STORE</h4>
                <button class="close-modal-btn" onclick="closeStoreModal()">&times;</button>
            </div>
            <div id="store-links-container" class="store-links-grid"></div>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let masterPlaylist = [];    
        let activePlaylist = [];    
        let collectionsList = [];   
        let currentIndex = 0;
        let isShuffled = false;
        let isRepeated = false;
        let currentFilterType = 'all'; 
        let currentFilterValue = null; 
        let currentPlayingTrackId = null;

        // Shuffle State Management
        let shufflePool = [];
        let iconRotationInterval = null;

        // Platform Signature Brand Colors for Rotating Text Display
        const platformColors = {
            'Apple Music': '#fa233b',
            'Spotify': '#1db954',
            'Tidal': '#00ffff',
            'YouTube': '#ff0000',
            'Pandora': '#0095ff'
        };

        // Capture URL query parameters right when the page loads
        const urlParams = new URLSearchParams(window.location.search);
        const targetArtistParam = urlParams.get('artist');
        const targetTrackParam = urlParams.get('track');

        const audioElement = document.getElementById('audio-element');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        async function initPlayer() {
            await Promise.all([loadTracks(), loadCollections()]);
            buildTabs();

            // Direct slug-based filtering from URL parameter (?artist=jair)
            if (targetArtistParam) {
                const cleanSlug = targetArtistParam.toLowerCase().trim();
                
                const filteredTracks = masterPlaylist.filter(track => 
                    track.artists && track.artists.slug && track.artists.slug.toLowerCase() === cleanSlug
                );

                if (filteredTracks.length > 0) {
                    activePlaylist = filteredTracks;
                }
            }

            // If a specific track ID was shared in URL, splice it right to index 0 and update social preview card!
            if (targetTrackParam) {
                const trackIndex = activePlaylist.findIndex(t => String(t.id) === String(targetTrackParam));
                if (trackIndex !== -1) {
                    const selectedTrack = activePlaylist.splice(trackIndex, 1)[0];
                    activePlaylist.unshift(selectedTrack);
                    updateSocialMeta(selectedTrack.title, selectedTrack.artists ? selectedTrack.artists.name : '2G Music Market', selectedTrack.artwork_url);
                }
            }

            if (activePlaylist.length > 0) {
                loadTrackData(0);
            }
            renderInlinePlaylist();
        }

        // Dynamic Open Graph Meta Tag Updater for Social Sharing Previews
        function updateSocialMeta(title, artist, artworkUrl) {
            document.getElementById('og-title').setAttribute('content', `${title} - ${artist}`);
            document.getElementById('og-desc').setAttribute('content', 'Stream or purchase directly on 2G Music Market');
            if (artworkUrl) {
                document.getElementById('og-image').setAttribute('content', artworkUrl);
            }
        }

        async function loadTracks() {
            const { data, error } = await _supabase
                .from('tracks')
                .select('id, title, audio_file_path, artwork_url, collection_id, collection_sort_order, sort_order, apple_music_url, spotify_url, tidal_url, youtube_url, pandora_url, store_single_url, store_album_url, price, artists(id, name, slug, aweber_tag)')
                .order('sort_order', { ascending: true, nullsFirst: false });

            if (!error && data) {
                masterPlaylist = data;
                activePlaylist = [...masterPlaylist];
                resetShufflePool();
            }
        }

        async function loadCollections() {
            const { data, error } = await _supabase
                .from('collections')
                .select('id, title, type, is_visible, sort_order, artist_id')
                .eq('is_visible', true)
                .order('sort_order', { ascending: true, nullsFirst: true });

            if (!error && data) {
                collectionsList = data;
            }
        }

        // Build Tabs: All Songs -> Artist Tabs -> Curated Playlists Tabs
        function buildTabs() {
            const tabsContainer = document.getElementById('category-tabs');
            tabsContainer.innerHTML = `<div class="cat-tab active-tab" onclick="filterCatalog('all', null, this)">All Songs</div>`;

            // Unique Artists
            const artistsMap = new Map();
            masterPlaylist.forEach(track => {
                if (track.artists && track.artists.id) {
                    artistsMap.set(track.artists.id, track.artists.name);
                }
            });

            artistsMap.forEach((artistName, artistId) => {
                const tab = document.createElement('div');
                tab.className = 'cat-tab';
                tab.innerText = artistName;
                tab.onclick = () => filterCatalog('artist', artistId, tab);
                tabsContainer.appendChild(tab);
            });

            // General Curated Playlists (type = 'playlist', artist_id is null)
            collectionsList.forEach(col => {
                if (col.type === 'playlist' && !col.artist_id) {
                    const tab = document.createElement('div');
                    tab.className = 'cat-tab playlist-tab';
                    tab.innerText = col.title;
                    tab.onclick = () => filterCatalog('playlist', col.id, tab);
                    tabsContainer.appendChild(tab);
                }
            });
        }

        // Filter Catalog: Switch view without disrupting playback
        function filterCatalog(type, value, tabElement) {
            currentFilterType = type;
            currentFilterValue = value;

            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active-tab'));
            if (tabElement) tabElement.classList.add('active-tab');

            const submenuBar = document.getElementById('submenu-bar');
            submenuBar.classList.add('hidden');
            submenuBar.innerHTML = '';

            if (type === 'all') {
                activePlaylist = [...masterPlaylist];
                renderInlinePlaylist();
            } else if (type === 'playlist') {
                activePlaylist = masterPlaylist
                    .filter(track => String(track.collection_id) === String(value))
                    .sort((a, b) => {
                        const orderA = a.collection_sort_order !== null && a.collection_sort_order !== undefined ? a.collection_sort_order : 99;
                        const orderB = b.collection_sort_order !== null && b.collection_sort_order !== undefined ? b.collection_sort_order : 99;
                        return orderA - orderB;
                    });
                renderInlinePlaylist();
            } else if (type === 'artist') {
                const artistTracks = masterPlaylist.filter(track => track.artists && String(track.artists.id) === String(value));
                const artistAlbums = collectionsList.filter(col => String(col.artist_id) === String(value) && col.type === 'album');
                
                const hasSingles = artistTracks.some(t => !t.collection_id);

                submenuBar.classList.remove('hidden');
                submenuBar.innerHTML = `
                    <div class="sub-tab" onclick="handleArtistSubMenu('singles', '${value}')">Singles</div>
                    <div class="sub-tab" onclick="handleArtistSubMenu('albums', '${value}')">Albums</div>
                `;

                if (hasSingles) {
                    activePlaylist = artistTracks.filter(t => !t.collection_id);
                } else {
                    activePlaylist = artistTracks;
                }
                renderInlinePlaylist();
            }
            resetShufflePool();
        }

        // Handle clicking "Singles" or "Albums" block under an artist
        function handleArtistSubMenu(subType, artistId) {
            document.querySelectorAll('.sub-tab').forEach(st => st.classList.remove('active-sub'));
            event.target.classList.add('active-sub');

            const artistTracks = masterPlaylist.filter(track => track.artists && String(track.artists.id) === String(artistId));
            
            const artistAlbums = collectionsList.filter(col => {
                const matchesColArtist = col.artist_id && String(col.artist_id) === String(artistId);
                const isAlbumType = col.type && col.type.toLowerCase() === 'album';
                const hasArtistTrackInCol = artistTracks.some(t => String(t.collection_id) === String(col.id));
                return isAlbumType && (matchesColArtist || hasArtistTrackInCol);
            });

            if (subType === 'singles') {
                activePlaylist = artistTracks.filter(t => !t.collection_id);
                renderInlinePlaylist();
            } else if (subType === 'albums') {
                renderAlbumList(artistAlbums, artistTracks);
            }
            resetShufflePool();
        }

        // Render the list of album projects
        function renderAlbumList(albums, artistTracks) {
            const container = document.getElementById('inline-tracks-container');
            container.innerHTML = '';

            if (!albums || albums.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; font-size:12px; margin:10px 0;">No albums available for this artist.</p>';
                return;
            }

            albums.forEach(album => {
                const albumTracksCount = artistTracks.filter(t => String(t.collection_id) === String(album.id)).length;
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.onclick = () => selectAlbum(album.id, artistTracks);

                item.innerHTML = `
                    <div class="playlist-item-info" style="padding: 4px 0;">
                        <div class="playlist-item-title">📁 ${album.title}</div>
                        <div class="playlist-item-artist">${albumTracksCount} track${albumTracksCount === 1 ? '' : 's'}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // When a specific album is clicked, switch view to its tracks sorted strictly by collection_sort_order
        function selectAlbum(albumId, artistTracks) {
            activePlaylist = artistTracks
                .filter(t => String(t.collection_id) === String(albumId))
                .sort((a, b) => {
                    const orderA = a.collection_sort_order !== null && a.collection_sort_order !== undefined ? a.collection_sort_order : 99;
                    const orderB = b.collection_sort_order !== null && b.collection_sort_order !== undefined ? b.collection_sort_order : 99;
                    return orderA - orderB;
                });
                
            renderInlinePlaylist();
            resetShufflePool();
        }

        function loadTrackData(index) {
            currentIndex = index;
            const track = activePlaylist[currentIndex];
            if (!track) return;

            currentPlayingTrackId = track.id;
            document.getElementById('track-title').innerText = track.title;
            document.getElementById('artist-name').innerText = track.artists ? track.artists.name : '2G Music Market';
            document.getElementById('track-artwork').src = track.artwork_url || '';
            
            audioElement.src = track.audio_file_path;
            progressBar.value = 0;
            currentTimeEl.innerText = "0:00";
            totalDurationEl.innerText = "0:00";
            
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');

            updateActiveTrackActions(track);
            renderInlinePlaylist();
        }

        function playTrack(index) {
            currentIndex = index;
            const track = activePlaylist[currentIndex];
            if (!track) return;

            currentPlayingTrackId = track.id;
            document.getElementById('track-title').innerText = track.title;
            document.getElementById('artist-name').innerText = track.artists ? track.artists.name : '2G Music Market';
            document.getElementById('track-artwork').src = track.artwork_url || '';
            
            audioElement.src = track.audio_file_path;
            audioElement.play().then(() => {
                updatePlayButton();
            }).catch(err => {
                console.log("Autoplay waiting for user interaction");
                updatePlayButton();
            });

            updateActiveTrackActions(track);
            renderInlinePlaylist();
        }

        // Conditional Action Button Evaluator ("STREAM NOW" + Brand Color Rotation & "Buy: $price" Button)
        function updateActiveTrackActions(track) {
            const streamBtn = document.getElementById('dynamic-stream-btn');
            const streamContainer = document.getElementById('stream-content-display');
            const buyBtn = document.getElementById('dynamic-buy-btn');
            const buyPriceDisplay = document.getElementById('buy-price-display');

            if (iconRotationInterval) {
                clearInterval(iconRotationInterval);
                iconRotationInterval = null;
            }

            // 1. Evaluate Streaming Links & Brand Colors (Starts with "STREAM NOW")
            const availablePlatforms = [];
            if (track.apple_music_url && track.apple_music_url.trim() !== '') availablePlatforms.push('Apple Music');
            if (track.spotify_url && track.spotify_url.trim() !== '') availablePlatforms.push('Spotify');
            if (track.tidal_url && track.tidal_url.trim() !== '') availablePlatforms.push('Tidal');
            if (track.youtube_url && track.youtube_url.trim() !== '') availablePlatforms.push('YouTube');
            if (track.pandora_url && track.pandora_url.trim() !== '') availablePlatforms.push('Pandora');

            if (availablePlatforms.length === 0) {
                streamBtn.classList.add('hidden');
            } else {
                streamBtn.classList.remove('hidden');
                
                // Build slides: Slide 0 is "STREAM NOW" (default white), followed by platforms with their brand colors
                const slides = [{ type: 'cta', text: 'STREAM NOW', color: '#ffffff' }];
                availablePlatforms.forEach(p => slides.push({ type: 'platform', text: p, color: platformColors[p] || '#ffffff' }));

                let slideIndex = 0;
                streamContainer.innerHTML = `<span style="color: #ffffff;">STREAM NOW</span>`;
                
                if (slides.length > 1) {
                    iconRotationInterval = setInterval(() => {
                        slideIndex = (slideIndex + 1) % slides.length;
                        const currentSlide = slides[slideIndex];
                        streamContainer.innerHTML = `<span style="color: ${currentSlide.color};">${currentSlide.text}</span>`;
                    }, 3000);
                }
            }

            // 2. Evaluate Green Purchase Button ("Buy: $price")
            if (track.price !== null && track.price !== undefined && track.price !== '') {
                buyBtn.classList.remove('hidden');
                buyPriceDisplay.innerText = `$${Number(track.price).toFixed(2)}`;
            } else {
                buyBtn.classList.add('hidden');
            }
        }

        function togglePlay() {
            if (audioElement.paused) {
                audioElement.play().then(() => { updatePlayButton(); });
            } else {
                audioElement.pause();
                updatePlayButton();
            }
        }

        function updatePlayButton() {
            if (!audioElement.paused) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.innerText = formatTime(audioElement.currentTime);
                totalDurationEl.innerText = formatTime(audioElement.duration);
            }
        });

        function seekAudio(value) {
            if (audioElement.duration) {
                audioElement.currentTime = (value / 100) * audioElement.duration;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // --- Optimized No-Repeat Shuffle Logic ---
        function resetShufflePool() {
            shufflePool = [];
            for (let i = 0; i < activePlaylist.length; i++) {
                if (i !== currentIndex) {
                    shufflePool.push(i);
                }
            }
            for (let i = shufflePool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shufflePool[i], shufflePool[j]] = [shufflePool[j], shufflePool[i]];
            }
        }

        function nextTrack() {
            if (activePlaylist.length === 0) return;
            
            if (isShuffled) {
                if (shufflePool.length === 0) {
                    resetShufflePool();
                }
                currentIndex = shufflePool.pop();
            } else {
                currentIndex = (currentIndex + 1) % activePlaylist.length;
            }
            playTrack(currentIndex);
        }

        function prevTrack() {
            if (activePlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + activePlaylist.length) % activePlaylist.length;
            playTrack(currentIndex);
        }

        function toggleShuffle() {
            isShuffled = !isShuffled;
            document.getElementById('shuffle-btn').classList.toggle('active', isShuffled);
            if (isShuffled) {
                resetShufflePool();
            }
        }

        function toggleRepeat() {
            isRepeated = !isRepeated;
            document.getElementById('repeat-btn').classList.toggle('active', isRepeated);
        }

        audioElement.addEventListener('play', updatePlayButton);
        audioElement.addEventListener('pause', updatePlayButton);
        audioElement.addEventListener('ended', () => {
            if (isRepeated) { audioElement.currentTime = 0; audioElement.play(); }
            else { nextTrack(); }
        });

        function revealSubscribeForm() {
            document.getElementById('action-row').classList.add('hidden');
            document.getElementById('subscribe-form-box').classList.remove('hidden');
            document.getElementById('subscriber-email').focus();
        }

        function hideSubscribeForm() {
            document.getElementById('subscribe-form-box').classList.add('hidden');
            document.getElementById('action-row').classList.remove('hidden');
        }

        document.addEventListener('click', (e) => {
            const subscribeContainer = document.querySelector('.subscribe-container');
            const formBox = document.getElementById('subscribe-form-box');
            if (subscribeContainer && formBox && !formBox.classList.contains('hidden')) {
                if (!subscribeContainer.contains(e.target)) {
                    hideSubscribeForm();
                }
            }
        });

        function submitSubscriber() {
            const emailInput = document.getElementById('subscriber-email');
            const email = emailInput.value.trim();
            
            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address.');
                return;
            }

            const currentTrack = activePlaylist[currentIndex];
            const rawTagString = currentTrack && currentTrack.artists ? currentTrack.artists.aweber_tag : '2g-general';

            const form = document.createElement('form');
            form.action = 'https://www.aweber.com/scripts/addlead.pl';
            form.method = 'POST';
            form.target = 'hidden-aweber-iframe';
            form.style.display = 'none';

            const fields = {
                'meta_web_form_id': '110822147',
                'meta_split_id': '',
                'listname': 'awlist6783124',
                'meta_adtracking': '2G_PWA_Player',
                'meta_message': '1',
                'meta_required': 'email',
                'name': 'PWA Fan',
                'email': email
            };

            for (const [key, value] of Object.entries(fields)) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = value;
                form.appendChild(input);
            }

            if (rawTagString) {
                const tagsArray = rawTagString.split(',').map(t => t.trim()).filter(t => t.length > 0);
                tagsArray.forEach((cleanTag, index) => {
                    const tagInput = document.createElement('input');
                    tagInput.type = 'hidden';
                    tagInput.name = `tag_11082214${index}`;
                    tagInput.value = cleanTag;
                    form.appendChild(tagInput);
                });
            }

            let iframe = document.getElementById('hidden-aweber-iframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'hidden-aweber-iframe';
                iframe.name = 'hidden-aweber-iframe';
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
            }

            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);

            alert('Thank you for joining!');
            emailInput.value = '';
            hideSubscribeForm();
        }

        // Share Track Function (Copies raw deep-link URL directly and updates social preview meta tags)
        function shareTrack(event, trackId) {
            event.stopPropagation(); // Prevent track from playing when clicking share
            const track = activePlaylist.find(t => t.id === trackId);
            if (!track) return;

            const artistSlug = track.artists && track.artists.slug ? track.artists.slug : 'all';
            const shareUrl = `${window.location.origin}${window.location.pathname}?artist=${artistSlug}&track=${track.id}`;

            if (navigator.share) {
                navigator.share({
                    url: shareUrl,
                }).catch(err => console.log('Error sharing:', err));
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('Share link copied to clipboard!');
                }).catch(err => {
                    console.error('Failed to copy link: ', err);
                });
            }
        }

        function renderInlinePlaylist() {
            const container = document.getElementById('inline-tracks-container');
            container.innerHTML = '';
            
            if (activePlaylist.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; font-size:12px; margin:10px 0;">No tracks found for this selection.</p>';
                return;
            }

            activePlaylist.forEach((track, index) => {
                const item = document.createElement('div');
                const isActive = track.id === currentPlayingTrackId;
                item.className = `playlist-item ${isActive ? 'active-track' : ''}`;
                item.onclick = () => playTrack(index);

                // Inject the orange Share button EXCLUSIVELY on the currently active track
                let shareButtonHtml = '';
                if (isActive) {
                    shareButtonHtml = `<button class="track-share-btn" onclick="shareTrack(event, '${track.id}')">Share</button>`;
                }

                item.innerHTML = `
                    <img src="${track.artwork_url || ''}" alt="Art">
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${track.title}</div>
                        <div class="playlist-item-artist">${track.artists ? track.artists.name : '2G Music Market'}</div>
                    </div>
                    ${shareButtonHtml}
                `;
                container.appendChild(item);
            });
        }

        /* Stream Modal */
        function openStreamModal() {
            const track = activePlaylist[currentIndex] || masterPlaylist.find(t => t.id === currentPlayingTrackId);
            if (!track) return;
            const container = document.getElementById('stream-links-container');
            container.innerHTML = '';
            const platforms = [
                { name: 'Apple Music', url: track.apple_music_url },
                { name: 'Spotify', url: track.spotify_url },
                { name: 'Tidal', url: track.tidal_url },
                { name: 'YouTube', url: track.youtube_url },
                { name: 'Pandora', url: track.pandora_url }
            ];
            let count = 0;
            platforms.forEach(p => {
                if (p.url && p.url.trim() !== '') {
                    count++;
                    const a = document.createElement('a');
                    a.href = p.url; a.target = '_blank'; a.className = 'stream-link-item'; a.innerText = p.name;
                    container.appendChild(a);
                }
            });
            if (count === 0) container.innerHTML = '<p style="color: #888; font-size: 14px;">No streaming links available.</p>';
            document.getElementById('stream-modal').classList.remove('hidden');
        }
        function closeStreamModal() { document.getElementById('stream-modal').classList.add('hidden'); }
        function closeStreamModalOnOutside(e) { if (e.target.id === 'stream-modal') closeStreamModal(); }

        /* Store Modal */
        function openStoreModal() {
            const track = activePlaylist[currentIndex] || masterPlaylist.find(t => t.id === currentPlayingTrackId);
            if (!track) return;
            const container = document.getElementById('store-links-container');
            container.innerHTML = '';

            let count = 0;
            if (track.store_single_url && track.store_single_url.trim() !== '') {
                count++;
                const a = document.createElement('a');
                a.href = track.store_single_url; a.target = '_blank'; a.className = 'store-link-item';
                a.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    Buy Single (${track.title})
                `;
                container.appendChild(a);
            }
            if (track.store_album_url && track.store_album_url.trim() !== '') {
                count++;
                const a = document.createElement('a');
                a.href = track.store_album_url; a.target = '_blank'; a.className = 'store-link-item album-btn';
                a.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                    Buy Full Album / Project
                `;
                container.appendChild(a);
            }

            if (count === 0) {
                container.innerHTML = '<p style="color: #888; font-size: 14px; margin: 10px 0;">No store links available for this track yet.</p>';
            }

            document.getElementById('store-modal').classList.remove('hidden');
        }
        function closeStoreModal() { document.getElementById('store-modal').classList.add('hidden'); }
        function closeStoreModalOnOutside(e) { if (e.target.id === 'store-modal') closeStoreModal(); }

        initPlayer();
    </script>
</body>
