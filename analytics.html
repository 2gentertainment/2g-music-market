<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2G Entertainment - Beta Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }
        h2 { color: #ff8c00; margin: 0; font-size: 20px; }
        
        /* Summary Cards Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .metric-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .metric-card h4 { margin: 0 0 5px 0; color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .metric-card .stat-val { font-size: 22px; font-weight: bold; color: #ff8c00; margin: 0; }

        .btn {
            background-color: #ff8c00;
            color: #000;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn:hover { background-color: #e07b00; }
        .secondary-btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
        }
        .secondary-btn:hover { background-color: #333; border-color: #ff8c00; }

        .analytics-table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .analytics-table th, .analytics-table td {
            padding: 12px 15px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #262626;
        }
        .analytics-table th {
            background-color: #222;
            color: #ff8c00;
            font-weight: 600;
        }
        .analytics-table tr:last-child td { border-bottom: none; }
        .analytics-table tr:hover { background-color: #222; }
        .loading, .no-data { text-align: center; padding: 40px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h2>Beta Engagement Analytics</h2>
            <div style="display: flex; gap: 10px;">
                <button class="btn secondary-btn" onclick="triggerManualSync()">Force Sync Queue</button>
                <a href="index.html" class="btn">← Back to Hub</a>
            </div>
        </div>

        <!-- Global Summary Cards -->
        <div id="metrics-summary" class="metrics-grid">
            <div class="metric-card">
                <h4>Unique Visitors</h4>
                <p class="stat-val" id="stat-unique-visitors">-</p>
            </div>
            <div class="metric-card">
                <h4>Total Plays</h4>
                <p class="stat-val" id="stat-total-plays">-</p>
            </div>
            <div class="metric-card">
                <h4>Store Clicks</h4>
                <p class="stat-val" id="stat-store-clicks">-</p>
            </div>
            <div class="metric-card">
                <h4>Stream Clicks</h4>
                <p class="stat-val" id="stat-stream-clicks">-</p>
            </div>
        </div>

        <div id="analytics-content">
            <div class="loading">Loading performance metrics...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://chhwujiajdhaihupvuix.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bHflg5jJHZfPzoOdsC5f_Q_H3YO4v3c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = function() {
            if (sessionStorage.getItem('2g_admin_auth') !== 'true') {
                alert('Unauthorized access. Please log in via the Master Admin Hub.');
                window.location.href = 'index.html';
                return;
            }
            fetchAnalytics();
        };

        async function fetchAnalytics() {
            const contentContainer = document.getElementById('analytics-content');

            try {
                const { data, error } = await _supabase
                    .from('tracks')
                    .select(`
                        id,
                        title,
                        artists ( name ),
                        analytics_events ( event_type, visitor_id )
                    `);

                if (error) throw error;

                if (!data || data.length === 0) {
                    contentContainer.innerHTML = `<div class="no-data">No tracks found in database.</div>`;
                    return;
                }

                // Global totals calculation
                let globalPlays = 0;
                let globalStoreClicks = 0;
                let globalStreamClicks = 0;
                const uniqueVisitorsSet = new Set();

                // Process counts per track
                const report = data.map(track => {
                    const events = track.analytics_events || [];
                    const plays = events.filter(e => e.event_type === 'play').length;
                    const storeClicks = events.filter(e => e.event_type === 'store_click').length;
                    const streamClicks = events.filter(e => e.event_type === 'stream_click').length;

                    globalPlays += plays;
                    globalStoreClicks += storeClicks;
                    globalStreamClicks += streamClicks;

                    events.forEach(e => {
                        if (e.visitor_id) uniqueVisitorsSet.add(e.visitor_id);
                    });

                    return {
                        title: track.title,
                        artist: track.artists ? track.artists.name : '2G Music Market',
                        plays,
                        storeClicks,
                        streamClicks
                    };
                });

                // Update Top Summary Cards
                document.getElementById('stat-unique-visitors').innerText = uniqueVisitorsSet.size;
                document.getElementById('stat-total-plays').innerText = globalPlays;
                document.getElementById('stat-store-clicks').innerText = globalStoreClicks;
                document.getElementById('stat-stream-clicks').innerText = globalStreamClicks;

                // Sort table rows by total plays descending
                report.sort((a, b) => b.plays - a.plays);

                let html = `
                    <table class="analytics-table">
                        <thead>
                            <tr>
                                <th>Track Title</th>
                                <th>Artist</th>
                                <th>Plays</th>
                                <th>Store Clicks</th>
                                <th>Stream Clicks</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                report.forEach(row => {
                    html += `
                        <tr>
                            <td><strong>${escapeHtml(row.title)}</strong></td>
                            <td style="color: #ff8c00;">${escapeHtml(row.artist)}</td>
                            <td>${row.plays}</td>
                            <td>${row.storeClicks}</td>
                            <td>${row.streamClicks}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                contentContainer.innerHTML = html;

            } catch (err) {
                console.error("Error fetching analytics:", err);
                contentContainer.innerHTML = `<div class="no-data" style="color: #ff4d4d;">Failed to load analytics data. Check console for details.</div>`;
            }
        }

        async function triggerManualSync() {
            try {
                const queue = JSON.parse(localStorage.getItem('analytics_queue') || '[]');
                if (queue.length === 0) {
                    alert('No local events currently queued in browser storage to sync.');
                    return;
                }

                const { error } = await _supabase.from('analytics_events').insert(queue);
                if (!error) {
                    localStorage.removeItem('analytics_queue');
                    alert(`Successfully synced ${queue.length} batched events to Supabase!`);
                    fetchAnalytics();
                } else {
                    alert('Error syncing queue. Check console.');
                    console.error(error);
                }
            } catch (err) {
                console.error('Manual sync error:', err);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
